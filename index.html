<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3776ab">
<title>PyLearn · Học Python online</title>
<style>
:root{
  --primary:#3776ab; --primary-dark:#2c5f8a; --accent:#ffd43b;
  --bg:#f5f7fb; --card:#fff; --text:#1a202c; --muted:#718096;
  --border:#e2e8f0; --success:#48bb78; --danger:#f56565;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

header{background:linear-gradient(135deg,#3776ab,#2c5f8a);color:#fff;
  padding:12px 16px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.15)}
.header-inner{max-width:900px;margin:0 auto;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:18px;font-weight:700;color:#fff;cursor:pointer;
  display:flex;align-items:center;gap:8px}
.reset-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;
  font-size:13px;transition:all .2s}
.reset-btn:active{background:rgba(255,255,255,.3)}

main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.hero{text-align:center;padding:20px 8px 28px}
.hero h1{font-size:26px;margin-bottom:10px;line-height:1.3}
.hero p{color:var(--muted);font-size:15px}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
.card{background:var(--card);border-radius:14px;padding:20px;
  border:1px solid var(--border);cursor:pointer;transition:all .2s;
  display:block;color:inherit}
.card:active{transform:scale(.99)}
.card-icon{font-size:36px;margin-bottom:10px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px;margin-bottom:12px}

.progress-bar{height:6px;background:var(--border);border-radius:3px;
  overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));
  transition:width .4s}
.progress-text{font-size:12px;color:var(--muted);margin-top:6px}

.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-size:14px;margin-bottom:16px;cursor:pointer;background:none;
  border:none;padding:6px 0;min-height:32px}
.back-btn:active{color:var(--primary)}

.page-title{font-size:22px;margin-bottom:6px}
.page-sub{color:var(--muted);margin-bottom:20px;font-size:14px}

.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-item{display:flex;align-items:center;gap:12px;
  background:var(--card);padding:14px 16px;border-radius:12px;
  border:1px solid var(--border);cursor:pointer;transition:all .2s;color:inherit}
.lesson-item:active{transform:scale(.99)}
.lesson-num{width:34px;height:34px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:600;
  color:var(--muted);flex-shrink:0;font-size:14px}
.lesson-item.done .lesson-num{background:var(--success);color:#fff}
.lesson-info{flex:1;min-width:0}
.lesson-info h4{font-size:15px;margin-bottom:2px}
.lesson-info span{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);font-size:22px;flex-shrink:0}

.content{background:var(--card);border-radius:14px;padding:20px;
  border:1px solid var(--border);margin-bottom:20px}
.content h2{margin:18px 0 10px;font-size:20px;line-height:1.3}
.content h2:first-child{margin-top:0}
.content h3{margin:14px 0 8px;font-size:17px}
.content p{margin-bottom:12px;font-size:15px}
.content ul,.content ol{margin:0 0 12px 22px;font-size:15px}
.content li{margin-bottom:6px}
.content strong{color:var(--primary-dark)}
.content code{background:#edf2f7;padding:2px 6px;border-radius:4px;
  font-size:13px;color:#c53030;font-family:'SF Mono',Monaco,'Courier New',monospace}
.content pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:10px;
  overflow-x:auto;margin-bottom:14px;font-size:13px;line-height:1.55;
  -webkit-overflow-scrolling:touch}
.content pre code{background:none;padding:0;color:inherit;font-size:13px}

.quiz{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border)}
.quiz h3{margin-bottom:12px;font-size:18px}
.quiz-progress{font-size:13px;color:var(--muted);margin-bottom:14px}
.question{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.5}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.option{padding:14px 16px;border:2px solid var(--border);border-radius:10px;
  cursor:pointer;background:#fff;text-align:left;font-size:15px;
  transition:all .15s;color:var(--text);min-height:48px;line-height:1.4}
.option:active:not(:disabled){background:#f7f8ff}
.option.correct{border-color:var(--success);background:#f0fff4;color:#22543d}
.option.wrong{border-color:var(--danger);background:#fff5f5;color:#742a2a}
.option:disabled{cursor:default}

.btn{background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border:none;padding:14px 24px;border-radius:10px;
  font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;
  min-height:48px;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}

.explanation{padding:12px 14px;border-radius:10px;margin-bottom:14px;
  font-size:14px;line-height:1.5}
.explanation.ok{background:#f0fff4;color:#22543d;border:1px solid #c6f6d5}
.explanation.no{background:#fff5f5;color:#742a2a;border:1px solid #fed7d7}

.result{text-align:center;padding:16px 0}
.result-score{font-size:44px;font-weight:700;margin-bottom:6px}
.result-score.pass{color:var(--success)}
.result-score.fail{color:var(--danger)}
.result-msg{color:var(--muted);margin-bottom:16px;font-size:14px}

.lesson-nav{display:flex;gap:10px;margin-top:20px}
.lesson-nav .btn{flex:1;font-size:14px;padding:12px 16px}

@media(min-width:640px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:32px}
  .page-title{font-size:26px}
  .content,.quiz{padding:28px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" onclick="go('/')">🐍 PyLearn</a>
    <button class="reset-btn" onclick="resetProgress()">↺ Xoá tiến độ</button>
  </div>
</header>

<main id="app"></main>

/* ================== QUẢN LÝ TIẾN ĐỘ ================== */
const STORE_KEY = 'pylearn_progress_v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { progress = {}; }

function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch(e) {}
}
function markDone(id) { progress[id] = true; saveProgress(); }
function isDone(id) { return !!progress[id]; }
function courseProgress() {
  const total = COURSE.lessons.length;
  const done = COURSE.lessons.filter(l => isDone(l.id)).length;
  return { done, total, pct: total ? Math.round(done * 100 / total) : 0 };
}
function resetProgress() {
  if (!confirm('Xoá toàn bộ tiến độ học của bạn?')) return;
  progress = {};
  saveProgress();
  render();
}

/* ================== ROUTING ================== */
function go(path) { location.hash = '#' + path; }

window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function render() {
  const hash = (location.hash || '#/').slice(1);
  const parts = hash.split('/').filter(Boolean);
  if (parts.length === 0) return renderHome();
  if (parts[0] === 'python' && parts.length === 1) return renderCourse();
  if (parts[0] === 'python' && parts.length === 2) return renderLesson(parts[1]);
  renderHome();
}

function renderHome() {
  const { done, total, pct } = courseProgress();
  document.getElementById('app').innerHTML = `
    <div class="hero">
      <h1>🐍 Học Python online</h1>
      <p>Học Python miễn phí với trắc nghiệm sau mỗi bài. Tiến độ tự lưu trên máy bạn.</p>
    </div>
    <div class="grid">
      <a class="card" onclick="go('/python')">
        <div class="card-icon">${COURSE.icon}</div>
        <h3>${COURSE.title}</h3>
        <p>${COURSE.desc}</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${done}/${total} bài hoàn thành (${pct}%)</div>
      </a>
    </div>
  `;
}

function renderCourse() {
  const items = COURSE.lessons.map((l, i) => {
    const done = isDone(l.id);
    return `
      <div class="lesson-item ${done ? 'done' : ''}" onclick="go('/python/${l.id}')">
        <div class="lesson-num">${done ? '✓' : (i + 1)}</div>
        <div class="lesson-info">
          <h4>${l.title}</h4>
          <span>${l.quiz.length} câu hỏi</span>
        </div>
        <div class="chev">›</div>
      </div>
    `;
  }).join('');
  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="go('/')">← Trang chủ</button>
    <h1 class="page-title">${COURSE.icon} ${COURSE.title}</h1>
    <p class="page-sub">${COURSE.desc}</p>
    <div class="lesson-list">${items}</div>
  `;
}

function renderLesson(lessonId) {
  const lesson = COURSE.lessons.find(l => l.id === lessonId);
  if (!lesson) return renderHome();
  const idx = COURSE.lessons.indexOf(lesson);
  const prev = COURSE.lessons[idx - 1];
  const next = COURSE.lessons[idx + 1];
  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="go('/python')">← Danh sách bài</button>
    <div class="content">${lesson.content}</div>
    <div class="quiz">
      <h3>📝 Kiểm tra kiến thức</h3>
      <div id="quiz-content"></div>
    </div>
    <div class="lesson-nav">
      ${prev ? `<button class="btn" onclick="go('/python/${prev.id}')">← Bài trước</button>` : ''}
      ${next ? `<button class="btn" onclick="go('/python/${next.id}')">Bài tiếp →</button>` : ''}
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'instant' });
  startQuiz(lesson);
}

/* ================== QUIZ ENGINE ================== */
let quizState = null;

function startQuiz(lesson) {
  quizState = { lesson, current: 0, correct: 0, answered: false, selected: null };
  renderQuiz();
}

function renderQuiz() {
  const { lesson, current, correct, answered, selected } = quizState;
  const q = lesson.quiz[current];
  const total = lesson.quiz.length;
  const isLast = current === total - 1;
  const box = document.getElementById('quiz-content');
  if (!box) return;

  const optHtml = q.options.map((opt, i) => {
    let cls = 'option';
    if (answered) {
      if (i === q.answer) cls += ' correct';
      else if (i === selected) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectAnswer(${i})" ${answered ? 'disabled' : ''}>${opt}</button>`;
  }).join('');

  let explainHtml = '';
  if (answered) {
    const ok = selected === q.answer;
    explainHtml = `<div class="explanation ${ok ? 'ok' : 'no'}">
      ${ok ? '✅ Chính xác!' : '❌ Sai rồi. Đáp án đúng: <strong>' + q.options[q.answer] + '</strong>'}
    </div>`;
  }

  box.innerHTML = `
    <div class="quiz-progress">Câu ${current + 1}/${total} · Đúng ${correct}</div>
    <div class="question">${q.q}</div>
    <div class="options">${optHtml}</div>
    ${explainHtml}
    ${answered ? `<button class="btn" onclick="nextQuestion()">${isLast ? 'Xem kết quả' : 'Câu tiếp theo →'}</button>` : ''}
  `;
}

function selectAnswer(i) {
  if (quizState.answered) return;
  quizState.selected = i;
  quizState.answered = true;
  if (i === quizState.lesson.quiz[quizState.current].answer) quizState.correct++;
  renderQuiz();
}

function nextQuestion() {
  const { lesson, current } = quizState;
  if (current < lesson.quiz.length - 1) {
    quizState.current++;
    quizState.answered = false;
    quizState.selected = null;
    renderQuiz();
  } else {
    showResult();
  }
}

function showResult() {
  const { lesson, correct } = quizState;
  const total = lesson.quiz.length;
  const pct = Math.round(correct * 100 / total);
  const pass = pct >= 70;
  if (pass) markDone(lesson.id);

  document.getElementById('quiz-content').innerHTML = `
    <div class="result">
      <div class="result-score ${pass ? 'pass' : 'fail'}">${correct}/${total}</div>
      <div class="result-msg">
        ${pass ? '🎉 Tuyệt vời! Bạn đã hoàn thành bài học.' : '😅 Chưa đạt 70%. Ôn lại rồi thử lại nhé!'}
      </div>
      <button class="btn" onclick="startQuiz(quizState.lesson)">Làm lại</button>
    </div>
  `;
}
</script>

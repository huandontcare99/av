/* =============== STATE =============== */
const DEFAULT_STATE = {
  xp:0, coins:0, lessons:{}, bestScores:{}, streakDays:[], achievements:[],
  totalCorrect:0, totalWrong:0, totalQuizzes:0, maxCombo:0, typesDone:[],
  dailyChallenge:{ date:null, done:false, lastDone:null },
  settings:{ sound:true }
};
let state = loadState();
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('pylearn_pro') || 'null');
    if (!s) return { ...DEFAULT_STATE };
    return { ...DEFAULT_STATE, ...s, settings: { ...DEFAULT_STATE.settings, ...(s.settings||{}) }, dailyChallenge: { ...DEFAULT_STATE.dailyChallenge, ...(s.dailyChallenge||{}) } };
  } catch(e) { return { ...DEFAULT_STATE }; }
}
function saveState() { try { localStorage.setItem('pylearn_pro', JSON.stringify(state)); } catch(e) {} }

/* =============== UTILITIES =============== */
const todayStr = () => new Date().toISOString().slice(0,10);
function getLevel(s = state) { return Math.floor((s.xp || 0) / 100) + 1; }
function getLevelProgress(s = state) { return (s.xp || 0) % 100; }
function getStreak(s = state) {
  const days = [...(s.streakDays||[])].sort().reverse();
  if (!days.length) return 0;
  let count = 0;
  const t = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(t); d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0,10);
    if (days.includes(ds)) count++;
    else if (i === 0) continue;
    else break;
  }
  return count;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(s) {
  return String(s).trim().toLowerCase().replace(/^["']|["']$/g, '').replace(/\s+/g, ' ');
}

/* =============== SOUND =============== */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; } }
  return audioCtx;
}
function playTone(freq, dur, type = 'sine', vol = 0.12) {
  if (!state.settings.sound) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  try {
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
const sfx = {
  correct: () => { playTone(523.25, 0.08); setTimeout(() => playTone(659.25, 0.12), 60); },
  wrong: () => playTone(180, 0.18, 'sawtooth', 0.08),
  click: () => playTone(800, 0.04, 'square', 0.04),
  coin: () => { playTone(1200, 0.04); setTimeout(() => playTone(1600, 0.06), 40); },
  levelup: () => [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => setTimeout(() => playTone(f, 0.15), i*80)),
  achievement: () => [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f,i) => setTimeout(() => playTone(f, 0.2), i*70)),
};
function toggleSound() {
  state.settings.sound = !state.settings.sound;
  saveState();
  const btn = document.getElementById('sound-btn');
  if (btn) btn.textContent = state.settings.sound ? '🔊' : '🔇';
  toast(state.settings.sound ? '🔊 Bật âm thanh' : '🔇 Tắt âm thanh');
}

/* =============== THEME =============== */
function initTheme() {
  if (localStorage.getItem('pylearn_theme') === 'dark') {
    document.documentElement.classList.add('dark');
    const b = document.getElementById('theme-btn'); if (b) b.textContent = '☀️';
  }
}
function toggleTheme() {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('pylearn_theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = dark ? '☀️' : '🌙';
}

/* =============== TOAST =============== */
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  let bg = '';
  if (type === 'success') bg = 'bg-emerald-500 text-white';
  else if (type === 'error') bg = 'bg-red-500 text-white';
  else if (type === 'achievement') bg = 'bg-gradient-to-r from-gold to-yellow-500 text-slate-900';
  else bg = 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900';
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-3 rounded-full ${bg} text-sm font-semibold shadow-2xl z-50 transition-transform duration-300 max-w-[90vw] text-center translate-y-0`;
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.classList.remove('translate-y-0');
    el.classList.add('translate-y-24');
  }, 2500);
}

/* =============== XP & COINS =============== */
function addXp(n) {
  const prevLv = getLevel();
  state.xp = (state.xp || 0) + n;
  const newLv = getLevel();
  if (newLv > prevLv) {
    sfx.levelup();
    setTimeout(() => toast(`🎉 Lên cấp ${newLv}!`, 'achievement'), 300);
  }
  updateHeader();
  saveState();
  return newLv - prevLv;
}
function addCoins(n) {
  state.coins = (state.coins || 0) + n;
  if (n > 0) sfx.coin();
  updateHeader();
  saveState();
}
function updateHeader() {
  const xpEl = document.getElementById('hdr-xp');
  const coinEl = document.getElementById('hdr-coins');
  if (xpEl) xpEl.textContent = '⚡ ' + (state.xp || 0);
  if (coinEl) coinEl.textContent = '🪙 ' + (state.coins || 0);
  const soundBtn = document.getElementById('sound-btn');
  if (soundBtn) soundBtn.textContent = state.settings.sound ? '🔊' : '🔇';
}

/* =============== ACHIEVEMENTS =============== */
function checkAchievements() {
  const unlocked = [];
  for (const a of ACHIEVEMENTS) {
    if (!state.achievements.includes(a.id) && a.check(state)) {
      state.achievements.push(a.id);
      unlocked.push(a);
    }
  }
  if (unlocked.length) {
    saveState();
    sfx.achievement();
    unlocked.forEach((a, i) => {
      setTimeout(() => {
        toast(`🏆 Mở khoá: ${a.icon} ${a.name}`, 'achievement');
        addCoins(10);
      }, i * 1500);
    });
  }
  return unlocked;
}

/* =============== ROUTING =============== */
function go(path) { location.hash = '#' + path; }
window.addEventListener('hashchange', render);
window.addEventListener('load', () => { initTheme(); render(); updateHeader(); });

function render() {
  const hash = (location.hash || '#/').slice(1);
  const parts = hash.split('/').filter(Boolean);
  window.scrollTo({top:0, behavior:'instant'});
  document.getElementById('modal-root').innerHTML = '';
  if (!parts.length) return renderHome();
  if (parts[0] === 'python' && parts.length === 1) return renderCourse();
  if (parts[0] === 'python' && parts.length === 2) return renderLesson(parts[1]);
  if (parts[0] === 'stats') return renderStats();
  if (parts[0] === 'daily') return startDailyChallenge();
  renderHome();
}

/* =============== QUIZ ENGINE =============== */
let quiz = null;

function startQuiz(lessonId) {
  const lesson = COURSE.lessons.find(l => l.id === lessonId);
  if (!lesson) return;
  quiz = {
    mode: 'lesson',
    lesson,
    current: 0,
    results: lesson.quiz.map(() => ({ attempts:0, correct:false, userAnswer:null, done:false })),
    startTime: Date.now(),
    questionStartTime: Date.now(),
    combo: 0,
    maxCombo: 0,
    hintsUsed: 0,
    freeHints: 3,
  };
  go('/quiz');
}

function startDailyChallenge() {
  const today = todayStr();
  if (state.dailyChallenge.date === today && state.dailyChallenge.done) {
    document.getElementById('app').innerHTML = `
      <button onclick="go('/')" class="flex items-center gap-1.5 text-slate-500 text-sm mb-3">← Trang chủ</button>
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-8 border border-slate-200 dark:border-slate-800 text-center">
        <div class="text-6xl mb-3">✅</div>
        <h2 class="text-xl font-bold mb-2">Đã hoàn thành hôm nay!</h2>
        <p class="text-sm text-slate-500 mb-4">Hẹn gặp lại vào ngày mai 👋</p>
        <button onclick="go('/')" class="px-6 py-3 rounded-xl bg-brand text-white font-bold">Về trang chủ</button>
      </div>`;
    return;
  }
  // Pick 5 random questions from all lessons
  const allQ = [];
  COURSE.lessons.forEach(lesson => lesson.quiz.forEach(q => allQ.push(q)));
  const picked = shuffle(allQ).slice(0, 5);
  quiz = {
    mode: 'daily',
    lesson: { id:'daily', title:'Thử thách hàng ngày', quiz: picked },
    current: 0,
    results: picked.map(() => ({ attempts:0, correct:false, userAnswer:null, done:false })),
    startTime: Date.now(),
    questionStartTime: Date.now(),
    combo: 0, maxCombo: 0, hintsUsed: 0, freeHints: 3,
  };
  go('/quiz');
}

function renderQuiz() {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  const total = quiz.lesson.quiz.length;
  const pct = (quiz.current / total) * 100;
  const elapsed = Math.floor((Date.now() - quiz.startTime) / 1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');

  const typeLabels = { mcq:'Trắc nghiệm', fill:'Điền từ', order:'Sắp xếp', drag:'Kéo thả', match:'Nối cặp', truefalse:'Đúng / Sai' };
  let body = '';
  if (q.type === 'mcq') body = renderMcq(q, r);
  else if (q.type === 'truefalse') body = renderTrueFalse(q, r);
  else if (q.type === 'fill') body = renderFill(q, r);
  else if (q.type === 'order') body = renderOrder(q, r);
  else if (q.type === 'drag') body = renderDrag(q, r);
  else if (q.type === 'match') body = renderMatch(q, r);

  document.getElementById('app').innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <button onclick="exitQuiz()" class="text-slate-500 text-sm active:text-brand">✕ Thoát</button>
      <div class="flex items-center gap-2">
        ${quiz.combo >= 2 ? `<div class="px-2 py-1 rounded-lg bg-orange-100 dark:bg-orange-900/40 text-orange-600 dark:text-orange-400 text-xs font-bold animate-pop">🔥 ${quiz.combo}x</div>` : ''}
        <div class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-mono">⏱ ${mm}:${ss}</div>
      </div>
    </div>

    <div class="mb-3">
      <div class="flex justify-between text-xs text-slate-500 mb-1.5">
        <span>Câu <strong class="text-brand dark:text-brand-light">${quiz.current+1}</strong>/${total}</span>
        <span>${quiz.mode === 'daily' ? '📅 Daily' : quiz.lesson.title}</span>
      </div>
      <div class="h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-brand to-brand-light rounded-full transition-all duration-300" style="width:${pct}%"></div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 md:p-5 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between mb-3">
        <span class="text-[10px] px-2 py-1 rounded-md bg-brand text-white font-bold uppercase tracking-wide">
          ${typeLabels[q.type] || 'Câu hỏi'}
        </span>
        ${!r.done ? `<button onclick="showHint()" class="text-xs px-2 py-1 rounded-md bg-gold/20 text-gold-dark dark:text-gold border border-gold/30 font-semibold active:scale-95">
          💡 Gợi ý${quiz.freeHints - quiz.hintsUsed <= 0 ? ` (5🪙)` : ` (${quiz.freeHints - quiz.hintsUsed})`}
        </button>` : ''}
      </div>
      <div class="font-semibold text-base mb-4 leading-relaxed">${esc(q.q)}</div>
      <div id="q-body">${body}</div>
    </div>
  `;

  if (q.type === 'fill' && !r.done) {
    const input = document.getElementById('fill-answer');
    if (input) {
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(); });
    }
  }
}

function exitQuiz() {
  if (confirm('Thoát bài làm? Tiến độ quiz sẽ mất.')) {
    quiz = null;
    if (location.hash.includes('/quiz')) go('/python');
    else render();
  }
}

function showHint() {
  const q = quiz.lesson.quiz[quiz.current];
  if (!q.hint) { toast('Không có gợi ý cho câu này'); return; }
  if (quiz.hintsUsed < quiz.freeHints) {
    quiz.hintsUsed++;
    toast('💡 ' + q.hint);
  } else {
    if (state.coins < 5) { toast('Không đủ xu! Cần 5🪙', 'error'); return; }
    addCoins(-5);
    quiz.hintsUsed++;
    toast('💡 ' + q.hint);
  }
}

/* --- MCQ --- */
function renderMcq(q, r) {
  const opts = q.options.map((opt, i) => {
    let cls = 'option px-4 py-3.5 rounded-xl border-2 flex items-center gap-3 text-left transition-all w-full';
    if (r.done) {
      if (i === q.answer) cls += ' border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20';
      else if (i === r.userAnswer) cls += ' border-red-500 bg-red-50 dark:bg-red-900/20';
      else cls += ' border-slate-200 dark:border-slate-800 opacity-60';
    } else {
      cls += ' border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-brand dark:hover:border-brand-light active:scale-[0.99] cursor-pointer';
    }
    return `<button class="${cls}" ${r.done?'disabled':''} onclick="selectMcq(${i})">
      <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold flex-shrink-0
        ${r.done && i===q.answer ? 'bg-emerald-500 text-white' : r.done && i===r.userAnswer ? 'bg-red-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">
        ${String.fromCharCode(65+i)}
      </span>
      <span class="text-sm">${esc(opt)}</span>
    </button>`;
  }).join('');
  return `<div class="space-y-2 mb-3">${opts}</div>${feedback(q, r, 'mcq')}`;
}

function selectMcq(i) {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  if (r.done) return;
  sfx.click();
  r.userAnswer = i;
  r.attempts++;
  if (i === q.answer) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- TRUE/FALSE --- */
function renderTrueFalse(q, r) {
  const userVal = r.userAnswer;
  const mk = (val, label, icon) => {
    let cls = 'flex-1 py-4 rounded-xl border-2 font-bold text-sm flex items-center justify-center gap-2 transition-all';
    if (r.done) {
      if (val === q.answer) cls += ' border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400';
      else if (val === userVal) cls += ' border-red-500 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400';
      else cls += ' border-slate-200 dark:border-slate-800 opacity-60';
    } else {
      cls += ' border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-brand active:scale-[0.98] cursor-pointer';
    }
    return `<button class="${cls}" ${r.done?'disabled':''} onclick="selectTrueFalse(${val})">${icon} ${label}</button>`;
  };
  return `<div class="flex gap-2 mb-3">${mk(true, 'ĐÚNG', '✔️')}${mk(false, 'SAI', '✖️')}</div>${feedback(q, r, 'truefalse')}`;
}

function selectTrueFalse(val) {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  if (r.done) return;
  sfx.click();
  r.userAnswer = val;
  r.attempts++;
  if (val === q.answer) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- FILL --- */
function renderFill(q, r) {
  let cls = 'w-full px-4 py-3.5 text-base rounded-xl border-2 font-mono mb-3 transition-all';
  if (r.done) cls += r.correct ? ' border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : ' border-red-500 bg-red-50 dark:bg-red-900/20';
  else cls += ' border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-brand focus:outline-none';
  const val = r.userAnswer ? esc(r.userAnswer) : '';
  return `
    <input type="text" id="fill-answer" class="${cls}" placeholder="Nhập đáp án..." value="${val}"
      ${r.done?'disabled':''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    ${!r.done ? `<button onclick="submitFill()" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold mb-3 active:scale-[0.98]">✓ Kiểm tra</button>` : ''}
    ${feedback(q, r, 'fill')}
  `;
}

function submitFill() {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  if (r.done) return;
  const input = document.getElementById('fill-answer');
  const user = input.value.trim();
  if (!user) { toast('Hãy nhập đáp án'); return; }
  r.userAnswer = user;
  r.attempts++;
  const norm = normalize(user);
  const isCorrect = q.answers.some(a => normalize(a) === norm);
  if (isCorrect) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- ORDER --- */
function renderOrder(q, r) {
  if (!r.shuffled) r.shuffled = shuffle(q.items);
  const items = r.shuffled;
  const list = items.map((item, i) => `
    <div class="flex items-center gap-2 p-3 rounded-lg bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700">
      <div class="flex-1 text-xs font-mono break-all">${esc(item)}</div>
      <div class="flex flex-col gap-0.5">
        <button ${i===0||r.done?'disabled':''} onclick="moveItem(${i},-1)" class="w-7 h-6 rounded bg-white dark:bg-slate-900 disabled:opacity-30 active:bg-brand active:text-white flex items-center justify-center text-xs">▲</button>
        <button ${i===items.length-1||r.done?'disabled':''} onclick="moveItem(${i},1)" class="w-7 h-6 rounded bg-white dark:bg-slate-900 disabled:opacity-30 active:bg-brand active:text-white flex items-center justify-center text-xs">▼</button>
      </div>
    </div>
  `).join('');
  return `<div class="space-y-2 mb-3">${list}</div>
    ${!r.done ? `<button onclick="submitOrder()" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold mb-3 active:scale-[0.98]">✓ Kiểm tra</button>` : ''}
    ${feedback(q, r, 'order')}`;
}

function moveItem(idx, dir) {
  const r = quiz.results[quiz.current];
  const j = idx + dir;
  if (j < 0 || j >= r.shuffled.length) return;
  sfx.click();
  [r.shuffled[idx], r.shuffled[j]] = [r.shuffled[j], r.shuffled[idx]];
  renderQuiz();
}

function submitOrder() {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  r.attempts++;
  const isCorrect = r.shuffled.every((v,i) => v === q.answer[i]);
  r.userAnswer = [...r.shuffled];
  if (isCorrect) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- DRAG --- */
function renderDrag(q, r) {
  if (!r.placement) {
    r.placement = {};
    q.items.forEach((_, i) => { r.placement[i] = -1; });
  }
  const selected = r.selected ?? -1;
  const bankItems = q.items.map((it, i) => {
    if (r.placement[i] !== -1) return '';
    const sel = selected === i ? 'ring-2 ring-brand scale-105 bg-brand/10' : '';
    return `<div onclick="selectDragItem(${i})" class="px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 text-xs font-mono font-bold cursor-pointer transition-all select-none ${sel}">${esc(it)}</div>`;
  }).join('');
  const slotsHtml = q.targets.map((t, ti) => {
    const itemsInSlot = q.items.map((it, i) => {
      if (r.placement[i] !== ti) return '';
      return `<div onclick="unplaceDragItem(${i})" class="px-2.5 py-1 rounded-md bg-white dark:bg-slate-900 border-2 border-brand text-xs font-mono font-bold cursor-pointer select-none">${esc(it)}</div>`;
    }).join('');
    const has = itemsInSlot ? 'border-solid bg-slate-50 dark:bg-slate-800/50' : 'border-dashed';
    return `<div onclick="placeDragItem(${ti})" class="rounded-lg border-2 ${has} border-slate-300 dark:border-slate-700 p-2.5 cursor-pointer transition-all active:border-brand">
      <div class="text-[10px] font-bold text-brand dark:text-brand-light uppercase tracking-wide mb-1.5">${esc(t.label)}</div>
      <div class="flex flex-wrap gap-1.5 min-h-[28px]">${itemsInSlot || '<span class="text-xs text-slate-400 italic">Chạm để thả vào đây</span>'}</div>
    </div>`;
  }).join('');

  return `
    <p class="text-xs text-slate-500 dark:text-slate-400 italic mb-2">📱 Chạm vào từ ở dưới → chạm ô để đặt. Chạm từ trong ô để bỏ ra.</p>
    <div class="flex flex-wrap gap-2 p-2.5 min-h-[52px] bg-slate-100 dark:bg-slate-800/50 rounded-lg mb-3 border-2 border-dashed border-slate-300 dark:border-slate-700">
      ${bankItems || '<span class="text-xs text-slate-400 self-center">Đã xếp hết</span>'}
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">${slotsHtml}</div>
    ${!r.done ? `<button onclick="submitDrag()" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold mb-3 active:scale-[0.98]">✓ Kiểm tra</button>` : ''}
    ${feedback(q, r, 'drag')}`;
}

function selectDragItem(idx) {
  const r = quiz.results[quiz.current];
  if (r.done) return;
  sfx.click();
  r.selected = (r.selected === idx) ? -1 : idx;
  renderQuiz();
}
function placeDragItem(targetIdx) {
  const r = quiz.results[quiz.current];
  if (r.done) return;
  if (r.selected == null || r.selected < 0) { toast('Chạm vào một từ trước'); return; }
  sfx.click();
  r.placement[r.selected] = targetIdx;
  r.selected = -1;
  renderQuiz();
}
function unplaceDragItem(idx) {
  const r = quiz.results[quiz.current];
  if (r.done) return;
  r.placement[idx] = -1;
  renderQuiz();
}
function submitDrag() {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  const allPlaced = q.items.every((_,i) => r.placement[i] !== -1);
  if (!allPlaced) { toast('Hãy đặt hết tất cả các từ'); return; }
  r.attempts++;
  let isCorrect = true;
  q.items.forEach((item, i) => {
    const correctTarget = q.targets.findIndex(t => t.accept.includes(item));
    if (r.placement[i] !== correctTarget) isCorrect = false;
  });
  r.userAnswer = { ...r.placement };
  if (isCorrect) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- MATCH --- */
function renderMatch(q, r) {
  if (!r.matchRight) {
    const rightOrder = shuffle(q.pairs.map((_, i) => i));
    r.matchRight = rightOrder;
    r.matches = {};
    r.selectedLeft = null;
  }
  const lefts = q.pairs.map((p, i) => {
    const matchedRight = r.matches[i];
    const sel = r.selectedLeft === i;
    let cls = 'p-3 rounded-lg border-2 text-sm font-bold cursor-pointer transition-all text-left w-full';
    if (r.done) {
      const isCorrect = matchedRight === i;
      cls += isCorrect ? ' border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : ' border-red-500 bg-red-50 dark:bg-red-900/20';
    } else if (matchedRight != null) {
      cls += ' border-brand bg-brand/10';
    } else if (sel) {
      cls += ' border-brand bg-brand/10 ring-2 ring-brand/30';
    } else {
      cls += ' border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-brand';
    }
    return `<button class="${cls}" ${r.done?'disabled':''} onclick="selectMatchLeft(${i})">${esc(p.left)}</button>`;
  }).join('');
  const rights = r.matchRight.map(rightIdx => {
    const pair = q.pairs[rightIdx];
    const matchedLeft = Object.keys(r.matches).find(k => r.matches[k] === rightIdx);
    const isMatched = matchedLeft != null;
    const sel = r.selectedLeft;
    let cls = 'p-3 rounded-lg border-2 text-sm cursor-pointer transition-all text-left w-full';
    if (r.done) {
      const matchedToCorrect = isMatched && parseInt(matchedLeft) === rightIdx;
      cls += matchedToCorrect ? ' border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : ' border-red-500 bg-red-50 dark:bg-red-900/20';
    } else if (isMatched) {
      cls += ' border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-800 opacity-60';
    } else if (sel != null) {
      cls += ' border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-brand cursor-pointer';
    } else {
      cls += ' border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900';
    }
    return `<button class="${cls}" ${r.done || isMatched ?'disabled':''} onclick="selectMatchRight(${rightIdx})">${esc(pair.right)}</button>`;
  }).join('');
  return `
    <p class="text-xs text-slate-500 italic mb-2">📱 Chạm vào ô bên trái rồi chạm ô bên phải để nối.</p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="space-y-2">${lefts}</div>
      <div class="space-y-2">${rights}</div>
    </div>
    ${!r.done ? `<button onclick="submitMatch()" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold mb-3 active:scale-[0.98]">✓ Kiểm tra</button>` : ''}
    ${feedback(q, r, 'match')}`;
}
function selectMatchLeft(i) {
  const r = quiz.results[quiz.current];
  if (r.done) return;
  sfx.click();
  r.selectedLeft = r.selectedLeft === i ? null : i;
  renderQuiz();
}
function selectMatchRight(rightIdx) {
  const r = quiz.results[quiz.current];
  if (r.done) return;
  if (r.selectedLeft == null) { toast('Chạm ô bên trái trước'); return; }
  sfx.click();
  r.matches[r.selectedLeft] = rightIdx;
  r.selectedLeft = null;
  renderQuiz();
}
function submitMatch() {
  const q = quiz.lesson.quiz[quiz.current];
  const r = quiz.results[quiz.current];
  const allMatched = Object.keys(r.matches).length === q.pairs.length;
  if (!allMatched) { toast('Hãy nối hết các cặp'); return; }
  r.attempts++;
  let isCorrect = true;
  q.pairs.forEach((_, i) => { if (r.matches[i] !== i) isCorrect = false; });
  r.userAnswer = { ...r.matches };
  if (isCorrect) { r.correct = true; r.done = true; awardCorrect(r); }
  else if (r.attempts >= 2) { r.done = true; awardWrong(r); }
  else { sfx.wrong(); }
  renderQuiz();
}

/* --- FEEDBACK --- */
function feedback(q, r, type) {
  if (!r.done && r.attempts === 0) return '';
  if (r.correct) {
    return `<div class="p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-300 dark:border-emerald-800 text-sm animate-slide-up">
      <strong class="text-emerald-700 dark:text-emerald-400">✅ Chính xác!</strong>
      ${q.explain ? `<div class="mt-1 text-emerald-800 dark:text-emerald-300/90 text-xs">${esc(q.explain)}</div>` : ''}
    </div>
    <button onclick="nextQ()" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold active:scale-[0.98]">
      ${quiz.current === quiz.lesson.quiz.length-1 ? '🏁 Xem kết quả' : 'Câu tiếp →'}
    </button>`;
  }
  if (r.attempts === 1) {
    return `<div class="p-3 rounded-lg bg-orange-50 dark:bg-orange-900/20 border border-orange-300 dark:border-orange-800 text-sm animate-shake">
      <strong class="text-orange-700 dark:text-orange-400">❌ Chưa đúng!</strong> Thử lại nào.
      ${q.hint ? `<div class="mt-1 text-orange-800 dark:text-orange-300/90 text-xs">💡 ${esc(q.hint)}</div>` : ''}
    </div>
    <button onclick="retryQ()" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-orange-500 to-orange-600 text-white font-bold active:scale-[0.98]">↻ Thử lại</button>`;
  }
  let correctAns = '';
  if (type === 'mcq') correctAns = q.options[q.answer];
  else if (type === 'truefalse') correctAns = q.answer ? 'ĐÚNG' : 'SAI';
  else if (type === 'fill') correctAns = q.answers[0];
  else if (type === 'order') correctAns = q.answer.join(' → ');
  else if (type === 'drag') correctAns = q.targets.map(t => `${t.label}: ${t.accept.join(', ')}`).join(' | ');
  else if (type === 'match') correctAns = q.pairs.map(p => `${p.left} → ${p.right}`).join(' | ');
  return `<div class="p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-300 dark:border-red-800 text-sm animate-slide-up">
    <strong class="text-red-700 dark:text-red-400">❌ Sai rồi.</strong>
    <div class="mt-1"><span class="text-xs text-slate-600 dark:text-slate-400">Đáp án đúng:</span> <strong class="text-slate-900 dark:text-white text-xs">${esc(correctAns)}</strong></div>
    ${q.explain ? `<div class="mt-2 text-xs text-slate-600 dark:text-slate-400 italic">📖 ${esc(q.explain)}</div>` : ''}
  </div>
  <button onclick="nextQ()" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold active:scale-[0.98]">
    ${quiz.current === quiz.lesson.quiz.length-1 ? '🏁 Xem kết quả' : 'Câu tiếp →'}
  </button>`;
}

function retryQ() {
  renderQuiz();
}

function awardCorrect(r) {
  sfx.correct();
  const isFirstTry = r.attempts === 1;
  // Combo
  quiz.combo++;
  if (quiz.combo > quiz.maxCombo) quiz.maxCombo = quiz.combo;
  // Base XP: 10 first try, 5 second try. Combo bonus: +2 per combo above 2
  let xp = isFirstTry ? 10 : 5;
  if (quiz.combo >= 3) xp += quiz.combo;
  // Speed bonus
  const qTime = (Date.now() - quiz.questionStartTime) / 1000;
  let speedBonus = 0;
  if (isFirstTry && qTime < 8) speedBonus = 3;
  addXp(xp + speedBonus);
  const coins = isFirstTry ? 3 : 1;
  addCoins(coins);
  state.totalCorrect = (state.totalCorrect || 0) + 1;
  // Type tracking
  const q = quiz.lesson.quiz[quiz.current];
  if (!state.typesDone) state.typesDone = [];
  if (!state.typesDone.includes(q.type)) state.typesDone.push(q.type);
  saveState();
  if (quiz.combo >= 3) setTimeout(() => toast(`🔥 Combo ${quiz.combo}! +${xp} XP`, 'success'), 200);
}

function awardWrong(r) {
  quiz.combo = 0;
  state.totalWrong = (state.totalWrong || 0) + 1;
  saveState();
}

function nextQ() {
  quiz.questionStartTime = Date.now();
  if (quiz.current < quiz.lesson.quiz.length - 1) {
    quiz.current++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}

/* =============== RESULT =============== */
function finishQuiz() {
  const correctCount = quiz.results.filter(r => r.correct).length;
  const total = quiz.results.length;
  const score = Math.round(correctCount * 100 / total);
  const pass = score >= 70;
  const time = Math.round((Date.now() - quiz.startTime) / 1000);
  const isDaily = quiz.mode === 'daily';

  let bonusXp = 0, bonusCoins = 0;
  if (isDaily) {
    bonusXp = 50; bonusCoins = 30;
    state.dailyChallenge = { date: todayStr(), done: true, lastDone: todayStr() };
  } else if (pass) {
    bonusXp = 20 + (score === 100 ? 30 : 0);
    bonusCoins = 15 + (score === 100 ? 20 : 0);
    if (!state.bestScores[quiz.lesson.id] || score > state.bestScores[quiz.lesson.id]) {
      state.bestScores[quiz.lesson.id] = score;
    }
    state.lessons[quiz.lesson.id] = true;
  } else {
    if (!state.bestScores[quiz.lesson.id] || score > state.bestScores[quiz.lesson.id]) {
      state.bestScores[quiz.lesson.id] = score;
    }
  }
  addXp(bonusXp);
  addCoins(bonusCoins);

  // Streak
  if (!state.streakDays.includes(todayStr())) state.streakDays.push(todayStr());
  // MaxCombo
  if (quiz.maxCombo > (state.maxCombo || 0)) state.maxCombo = quiz.maxCombo;
  state.totalQuizzes = (state.totalQuizzes || 0) + 1;
  saveState();

  checkAchievements();

  const wrong = quiz.results.map((r,i) => ({r, q: quiz.lesson.quiz[i], i})).filter(x => !x.r.correct);
  quiz._wrong = wrong;
  quiz._score = score;

  const idx = isDaily ? -1 : COURSE.lessons.indexOf(quiz.lesson);
  const nextLesson = idx >= 0 ? COURSE.lessons[idx+1] : null;

  const emoji = pass ? (score === 100 ? '🏆' : '🎉') : '😅';

  document.getElementById('app').innerHTML = `
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 text-center animate-bounce-in">
      <div class="text-7xl mb-3">${emoji}</div>
      <div class="text-5xl font-extrabold mb-1 ${pass ? 'text-emerald-500' : 'text-red-500'}">${correctCount}/${total}</div>
      <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">
        ${pass ? 'Tuyệt vời! Bạn đã hoàn thành bài học.' : 'Chưa đạt 70%. Ôn lại và thử lại nhé!'}
      </p>

      <div class="grid grid-cols-3 gap-2 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl mb-4">
        <div><div class="text-lg font-bold text-brand dark:text-brand-light">${score}%</div><div class="text-[10px] text-slate-500">Điểm</div></div>
        <div><div class="text-lg font-bold text-brand dark:text-brand-light">${time}s</div><div class="text-[10px] text-slate-500">Thời gian</div></div>
        <div><div class="text-lg font-bold text-gold-dark">+${bonusXp}⚡</div><div class="text-[10px] text-slate-500">Bonus</div></div>
      </div>

      <div class="grid grid-cols-3 gap-2 p-3 bg-orange-50 dark:bg-orange-900/20 rounded-xl mb-4">
        <div><div class="text-lg font-bold text-orange-500">${quiz.maxCombo}x</div><div class="text-[10px] text-slate-500">Max Combo</div></div>
        <div><div class="text-lg font-bold text-gold-dark">+${bonusCoins}🪙</div><div class="text-[10px] text-slate-500">Xu</div></div>
        <div><div class="text-lg font-bold text-purple-500">${(quiz.results.reduce((a,r) => a+r.attempts,0))}</div><div class="text-[10px] text-slate-500">Lượt thử</div></div>
      </div>

      <div class="space-y-2">
        ${!isDaily && pass ? `<button onclick="showCertificate('${quiz.lesson.id}', ${score})" class="w-full py-3 rounded-xl bg-gradient-to-r from-gold to-gold-dark text-slate-900 font-bold active:scale-[0.98]">🏅 Xem chứng chỉ</button>` : ''}
        ${wrong.length > 0 ? `<button onclick="showReview()" class="w-full py-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-sm active:scale-[0.98]">📋 Ôn lại ${wrong.length} câu sai</button>` : ''}
        ${!isDaily ? `<button onclick="startQuiz('${quiz.lesson.id}')" class="w-full py-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold text-sm active:scale-[0.98]">↻ Làm lại</button>` : ''}
        ${nextLesson && pass ? `<button onclick="go('/python/${nextLesson.id}')" class="w-full py-3 rounded-xl bg-gradient-to-r from-brand to-brand-dark text-white font-bold active:scale-[0.98]">📖 Bài tiếp: ${nextLesson.title} →</button>` : ''}
        <button onclick="go('/')" class="w-full py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-semibold active:scale-[0.98]">Về trang chủ</button>
      </div>
    </div>
    <div id="review-section" class="mt-4"></div>
    <div id="cert-root"></div>
  `;

  if (pass) fireConfetti();
}

function showReview() {
  const wrong = quiz._wrong;
  if (!wrong || !wrong.length) return;
  const html = wrong.map(({r, q, i}) => {
    let correctAns = '', yourAns = '';
    if (q.type === 'mcq') {
      correctAns = q.options[q.answer];
      yourAns = typeof r.userAnswer === 'number' ? q.options[r.userAnswer] : '';
    } else if (q.type === 'truefalse') {
      correctAns = q.answer ? 'ĐÚNG' : 'SAI';
      yourAns = r.userAnswer === true ? 'ĐÚNG' : r.userAnswer === false ? 'SAI' : '';
    } else if (q.type === 'fill') {
      correctAns = q.answers[0];
      yourAns = String(r.userAnswer || '');
    } else if (q.type === 'order') {
      correctAns = q.answer.join(' → ');
      yourAns = Array.isArray(r.userAnswer) ? r.userAnswer.join(' → ') : '';
    } else if (q.type === 'drag') {
      correctAns = q.targets.map(t => `${t.label}: ${t.accept.join(', ')}`).join(' | ');
    } else if (q.type === 'match') {
      correctAns = q.pairs.map(p => `${p.left} → ${p.right}`).join(' | ');
    }
    return `<div class="bg-white dark:bg-slate-900 rounded-xl p-3 border border-slate-200 dark:border-slate-800">
      <div class="font-semibold text-sm mb-1.5">Câu ${i+1}: ${esc(q.q)}</div>
      ${yourAns ? `<div class="text-xs text-red-500 mb-1">✗ Bạn: ${esc(yourAns)}</div>` : ''}
      <div class="text-xs text-emerald-500 mb-1">✓ Đáp án: ${esc(correctAns)}</div>
      ${q.explain ? `<div class="text-xs text-slate-500 mt-1.5 pt-1.5 border-t border-slate-200 dark:border-slate-800">📖 ${esc(q.explain)}</div>` : ''}
    </div>`;
  }).join('');
